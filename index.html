<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Space+Mono:wght@400;700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#121311;--panel:#1a1c19;--panel2:#212420;--line:#33372f;--ink:#ECEEE6;--mute:#8C9384;--faint:#5e6557;
    --acc:#C7F03D;--acc-dim:#9bbb2f;--warn:#E8895A;--bad:#E0633F;--ok:#7FCB4F;
    --mono:"Space Mono",monospace;--disp:"Fraunces",serif;--body:"Hanken Grotesk",sans-serif;}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  body{background-image:radial-gradient(circle at 85% -10%,rgba(199,240,61,.07),transparent 45%);min-height:100vh}
  .wrap{max-width:1220px;margin:0 auto;padding:26px 22px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:14px;gap:16px;flex-wrap:wrap}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--acc)}
  h1{font-family:var(--disp);font-weight:900;font-size:clamp(24px,3.2vw,40px);line-height:.95;margin:0;letter-spacing:-.01em}
  h1 em{font-style:italic;font-weight:500;color:var(--mute)}
  .langrow{display:flex;gap:16px;flex-wrap:wrap}
  .langset{display:flex;align-items:center;gap:7px}
  .langset .cap{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-family:var(--mono);font-size:11px}
  .seg button{background:transparent;color:var(--mute);border:none;padding:6px 11px;cursor:pointer;font-family:var(--mono);letter-spacing:.05em}
  .seg button.on{background:var(--acc);color:#16180f;font-weight:700}
  .targetbar{margin-bottom:18px}
  .tlabel{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .targets{display:flex;flex-wrap:wrap;gap:7px}
  .tgt{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--mute);cursor:pointer;transition:.13s}
  .tgt:hover{border-color:var(--acc-dim);color:var(--ink)}
  .tgt.on{background:var(--acc);border-color:var(--acc);color:#16180f}
  .tgt .ic{font-family:var(--mono);font-size:10px;opacity:.7}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .sechead{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:0 0 13px;display:flex;align-items:center;gap:9px}
  .sechead .n{color:var(--bg);background:var(--acc);width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:11px}
  .hide{display:none!important}
  label.fld{display:block;margin-bottom:14px}
  label.fld>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
  label.fld>span small{font-weight:400;color:var(--faint);font-family:var(--mono);font-size:10.5px;margin-left:6px;letter-spacing:.04em}
  textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:var(--body);font-size:14px;padding:10px 12px;resize:vertical;line-height:1.5}
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--acc-dim);box-shadow:0 0 0 3px rgba(199,240,61,.12)}
  textarea::placeholder,input::placeholder{color:var(--faint)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;transition:.13s;user-select:none}
  .chip:hover{border-color:var(--acc-dim);color:var(--ink)}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#16180f;font-weight:700}
  .toggles{display:flex;flex-direction:column;gap:9px}
  .tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;cursor:pointer}
  .tg:hover{border-color:var(--acc-dim)}
  .tg .lab{font-size:13px;font-weight:600}.tg .desc{font-size:11.5px;color:var(--faint);margin-top:2px}
  .sw{width:36px;height:21px;border-radius:20px;background:var(--line);position:relative;flex:0 0 auto;transition:.15s}
  .sw::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:var(--mute);top:3px;left:3px;transition:.15s}
  .tg.on .sw{background:var(--acc)}.tg.on .sw::after{left:18px;background:#16180f}
  .outwrap{position:sticky;top:16px}
  .outhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .outtitle{font-family:var(--disp);font-size:21px;font-weight:600;display:flex;align-items:center;gap:9px}
  .modetag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
  .obtns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;transition:.13s}
  .btn-acc{background:var(--acc);color:#16180f}.btn-acc:hover{background:#d4f95a}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}.btn-ghost:hover{border-color:var(--acc-dim);color:var(--ink)}
  .hint{font-size:11.5px;color:var(--faint);background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc-dim);border-radius:8px;padding:9px 11px;margin-bottom:10px;line-height:1.5}
  .out{background:#0d0e0c;border:1px solid var(--line);border-radius:12px;padding:18px;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:200px;color:#dfe3d6}
  .out .tag{color:var(--acc);font-weight:700}.out .vr{color:var(--warn);font-weight:700}
  .out .empty{color:var(--faint);font-style:italic;font-family:var(--body)}
  textarea.rawedit{min-height:240px;font-family:var(--mono);font-size:12.5px;background:#0d0e0c;line-height:1.6}
  /* length meter */
  .lenbar{margin-top:11px}
  .lentop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:5px;letter-spacing:.03em}
  .lentrack{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
  .lenfill{height:100%;width:0;transition:.25s;background:var(--ok)}
  .lenadvice{font-size:11.5px;margin-top:7px;line-height:1.5;color:var(--mute)}
  .lenadvice.warn{color:var(--warn)}.lenadvice.bad{color:var(--bad)}
  /* quality */
  .qual{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .qdot{width:9px;height:9px;border-radius:50%;background:var(--line)}.qdot.on{background:var(--acc)}
  .qtxt{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.03em}
  /* vars */
  .varspanel{margin-top:14px}
  .varrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .varkey{font-family:var(--mono);font-size:11px;color:var(--acc);white-space:nowrap;min-width:120px;overflow:hidden;text-overflow:ellipsis}
  /* followups & library tabs */
  .tabs{display:flex;gap:6px;margin:18px 0 10px}
  .tab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
  .tab.on{background:var(--panel2);border-color:var(--acc-dim);color:var(--ink)}
  .fchip{display:inline-block;font-size:12px;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;margin:0 6px 6px 0;transition:.13s}
  .fchip:hover{border-color:var(--acc);color:var(--acc)}
  .libitem{padding:11px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer}
  .libitem:hover{border-color:var(--acc-dim)}
  .libitem .ln{font-size:12.5px;font-weight:600;line-height:1.35}
  .libitem .ls{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .hitem{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
  .hitem .hmain{flex:1;min-width:0;cursor:pointer}
  .hitem .hname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hitem .hsub{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
  .hbtn{font-family:var(--mono);font-size:10px;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:5px 7px;cursor:pointer}
  .hbtn:hover{border-color:var(--acc-dim);color:var(--ink)}.hbtn.del:hover{border-color:var(--bad);color:var(--bad)}
  .hempty{font-size:12px;color:var(--faint);font-style:italic;padding:6px 2px}
  .store-note{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:8px;line-height:1.5}
  .ibtn{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:6px;border:1px solid var(--line);border-radius:50%;font-size:9px;color:var(--mute);cursor:pointer;font-family:var(--mono);vertical-align:middle;line-height:1}
  .ibtn:hover{border-color:var(--acc);color:var(--acc)}
  .ipop{position:absolute;max-width:300px;background:#0d0e0c;border:1px solid var(--acc-dim);border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.5;color:var(--ink);z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:700px;width:100%;max-height:86vh;overflow:auto;padding:28px 30px}
  .modal h2{font-family:var(--disp);font-weight:900;font-size:28px;margin:0 0 6px}
  .modal .lead{color:var(--mute);font-size:14px;line-height:1.55;margin:0 0 6px}
  .modal .faqq{font-weight:700;color:var(--ink);font-size:14.5px;margin-top:18px;display:flex;gap:8px;align-items:baseline}
  .modal .faqq::before{content:"›";color:var(--acc);font-weight:700}
  .modal .faqa{color:var(--mute);font-size:13.5px;line-height:1.6;margin-top:4px}
  .modal .faqa b{color:var(--ink)}
  .modalclose{float:right;font-family:var(--mono);font-size:12px;background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:7px 12px;cursor:pointer}
  .modalclose:hover{border-color:var(--acc);color:var(--acc)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--acc);color:#16180f;font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:11px 20px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="kicker" id="kicker">Prompt · Engineer</div>
      <h1 id="title">Prompt Engineer <em>workbench</em></h1>
    </div>
    <div class="langrow">
      <button class="btn btn-ghost" id="faqBtn" style="align-self:center">❓ FAQ</button>
      <div class="langset"><span class="cap" id="uiCap">Rozhraní</span>
        <div class="seg"><button id="uiCS" class="on" onclick="setUI('cs')">CZ</button><button id="uiEN" onclick="setUI('en')">EN</button></div></div>
      <div class="langset"><span class="cap" id="outCap">Jazyk výstupu</span>
        <div class="seg"><button id="outCS" class="on" onclick="setOut('cs')">CZ</button><button id="outEN" onclick="setOut('en')">EN</button></div></div>
    </div>
  </header>

  <div class="targetbar">
    <div class="tlabel" id="tgtLabel">Cílový nástroj — určuje formát i limit délky</div>
    <div class="targets" id="targets"></div>
  </div>

  <div class="grid">
    <div>
      <div class="panel" style="margin-bottom:20px">
        <p class="sechead"><span class="n">1</span> <span id="h1lab">Jádro</span></p>
        <label class="fld"><span id="taskLab"></span><textarea id="task" rows="2"></textarea></label>
        <label class="fld"><span id="goalLab"></span><textarea id="goal" rows="2"></textarea></label>
        <label class="fld"><span id="ctxLab"></span><textarea id="ctx" rows="2"></textarea></label>
        <label class="fld"><span id="audLab"></span><input type="text" id="aud"></label>
        <label class="fld" style="margin-bottom:0"><span id="notesLab"></span><input type="text" id="notes"></label>
      </div>
      <div class="panel section-role" style="margin-bottom:20px">
        <p class="sechead"><span class="n">2</span> <span id="h2lab">Role experta</span></p>
        <div class="chips" id="roles"></div>
        <label class="fld" style="margin-top:12px;margin-bottom:0"><span id="roleCustomLab"></span><input type="text" id="roleCustom"></label>
      </div>
      <div class="panel section-style" style="margin-bottom:20px">
        <p class="sechead"><span class="n">3</span> <span id="h3lab">Formát & tón</span></p>
        <label class="fld"><span id="fmtLab"></span><div class="chips" id="formats"></div></label>
        <label class="fld"><span id="toneLab"></span><div class="chips" id="tones"></div></label>
        <label class="fld" style="margin-bottom:0"><span id="lenLab"></span><div class="chips" id="lengths"></div></label>
      </div>
      <div class="panel">
        <p class="sechead"><span class="n">4</span> <span id="h4lab">Techniky & omezení</span></p>
        <label class="fld"><span id="approachLab"></span><div class="chips" id="approach"></div></label>
        <div class="toggles" id="toggles"></div>
        <label class="fld" style="margin-top:13px;margin-bottom:0"><span id="avoidLab"></span><textarea id="avoid" rows="2"></textarea></label>
      </div>
    </div>

    <div class="outwrap">
      <div class="outhead">
        <div class="outtitle"><span id="outTitle">Hotový prompt</span><span class="modetag" id="modeTag"></span></div>
        <div class="obtns">
          <button class="btn btn-ghost" id="builderBtn">← Builder</button>
          <button class="btn btn-ghost" id="saveBtn">＋ Uložit</button>
          <button class="btn btn-acc" id="copyBtn">Kopírovat</button>
        </div>
      </div>
      <div class="hint" id="hint"></div>
      <div id="outBox" class="out"></div>
      <textarea id="rawEdit" class="rawedit hide"></textarea>

      <!-- length meter -->
      <div class="lenbar">
        <div class="lentop"><span id="lenLabel">Délka</span><span id="lenCount">0</span></div>
        <div class="lentrack"><div class="lenfill" id="lenFill"></div></div>
        <div class="lenadvice" id="lenAdvice"></div>
      </div>

      <!-- quality -->
      <div class="qual">
        <div style="display:flex;gap:5px" id="qDots"></div>
        <div class="qtxt" id="qTxt"></div>
      </div>

      <!-- variables -->
      <div class="varspanel hide" id="varsPanel">
        <div class="sechead" style="margin-bottom:9px" id="varsHead">Proměnné</div>
        <div id="varsList"></div>
      </div>

      <!-- tabs: followups / library / saved -->
      <div class="tabs">
        <button class="tab on" data-tab="follow" id="tabFollow">Follow-up</button>
        <button class="tab" data-tab="library" id="tabLib">Knihovna</button>
        <button class="tab" data-tab="saved" id="tabSaved">Uložené</button>
      </div>

      <div id="paneFollow">
        <div class="hint" id="followHint" style="border-left-color:var(--warn)"></div>
        <div id="followChips"></div>
      </div>

      <div id="paneLib" class="hide">
        <div id="libList"></div>
      </div>

      <div id="paneSaved" class="hide">
        <div class="obtns" style="margin-bottom:10px">
          <button class="btn btn-ghost" id="exportBtn">Export</button>
          <button class="btn btn-ghost" id="importBtn">Import</button>
        </div>
        <div id="histList"></div>
        <div class="store-note" id="storeNote"></div>
        <input type="file" id="fileIn" accept="application/json" style="display:none">
      </div>
    </div>
  </div>
</div>
<div class="overlay hide" id="faqOverlay"><div class="modal" id="faqModal"></div></div>
<div class="ipop hide" id="ipop"></div>
<div class="toast" id="toast"></div>

function showPop(key,anchor){const pop=$("ipop");pop.textContent=INFO[S.uiLang][key]||"";

  pop.style.top=(window.scrollY+r.bottom+6)+"px";pop.style.left=Math.max(8,left)+"px";ipopKey=key;}

document.addEventListener("click",e=>{if(!(e.target.classList&&e.target.classList.contains("ibtn"))&&e.target.id!=="ipop")hidePop();});
function addIcon(id,key){const el=$(id);if(!el||!(INFO[S.uiLang]&&INFO[S.uiLang][key]))return;

function L(){return T[S.uiLang];}

function val(x,fb){return (x&&x.trim())?x.trim():fb;}

/* ====== BUILDERS ====== */
function sec(tag,body,mode){if(mode==="xml"){const x=tag.toLowerCase().replace(/[^a-z]/g,"_");return `<${x}>\n${body}\n</${x}>`;}return `# ${tag}\n${body}`;}
function techLines(){const d=OL(),o=[];["cot","steps","nohall","ground","uncertainty","critique"].forEach(k=>{if(S.tech[k])o.push("- "+d.techS[k]);});return o;}
function approachLine(){return OL().approachSent[S.creativity]||"";}
function roleName(){if(S.roleCustom.trim())return S.roleCustom.trim();return S.roleIdx>0?OL().roles[S.roleIdx]:"";}
function buildStandard(mode){const d=OL(),H=d.H,b=[];const role=roleName();
  if(role)b.push(sec(H.ROLE,d.roleSent(role),mode));
  b.push(sec(H.TASK,val(S.task,d.defaultTask),mode));
  if(S.goal.trim())b.push(sec(H.GOAL,d.goalSent(S.goal.trim()),mode));
  if(S.ctx.trim())b.push(sec(H.CONTEXT,S.ctx.trim(),mode));
  if(S.aud.trim())b.push(sec(H.AUDIENCE,d.audSent(S.aud.trim()),mode));
  b.push(sec(H.FORMAT,`- ${d.fmt[S.format]}\n- ${H.TONE}: ${d.tones[S.tone]}.\n- ${d.len[S.length]}\n- ${d.respond}`,mode));
  const tl=techLines();const ap=approachLine();if(ap)tl.push("- "+ap);if(tl.length)b.push(sec(H.GUIDE,tl.join("\n"),mode));
  if(S.avoid.trim())b.push(sec(H.AVOID,S.avoid.trim(),mode));
  if(S.tech.example)b.push(sec(H.EXAMPLE,(S.outLang==="cs"?"Vstup: [ukázkový vstup]\nKýžený výstup: [ukázkový výstup]":"Input: [sample input]\nDesired output: [sample output]"),mode));
  return b.join("\n\n");}
function buildPerplexity(){const d=OL(),H=d.H,cs=S.outLang==="cs",b=[];
  b.push(`# ${H.QUESTION}\n${val(S.task,d.defaultTask)}`);
  if(S.goal.trim())b.push(`# ${H.GOAL}\n${S.goal.trim()}`);
  if(S.ctx.trim())b.push(`# ${H.CONTEXT}\n${S.ctx.trim()}`);
  const f=[];if(S.tech.ground)f.push(cs?"jen ověřitelná fakta s odkazy":"only verifiable facts with links");
  if(S.tech.uncertainty)f.push(cs?"označ, kde si zdroje protiřečí":"flag where sources disagree");
  f.push(cs?"nejnovější dostupné údaje":"the most recent data available");
  if(S.tech.nohall)f.push(cs?"nevymýšlej fakta/čísla/citace; co nejde ověřit, označ jako nejisté":"don't invent facts/numbers/citations; flag unverifiable items as uncertain");
  const apx=approachLine();if(apx)f.push(apx);
  b.push(`# ${H.FOCUS}\n- ${f.join("\n- ")}`);
  b.push(`# ${H.SOURCES}\n${cs?"primární zdroje před agregátory":"primary sources over aggregators"}`);
  if(S.avoid.trim())b.push(`# ${H.AVOID}\n${S.avoid.trim()}`);
  b.push(`# ${H.LANG}\n${d.respond}`);return b.join("\n\n");}
function buildImage(){const cs=S.outLang==="cs",b=[];
  b.push((cs?"Scéna / předmět: ":"Scene / subject: ")+val(S.task,cs?"[co má být na obrázku]":"[what the image shows]"));
  if(S.ctx.trim())b.push((cs?"Detaily: ":"Details: ")+S.ctx.trim());
  if(S.goal.trim())b.push((cs?"Účel / nálada: ":"Purpose / mood: ")+S.goal.trim());
  b.push(cs?"Styl: [fotorealistické / ilustrace / 3D / akvarel]":"Style: [photorealistic / illustration / 3D / watercolor]");
  b.push(cs?"Kompozice & světlo: [úhel, záběr, osvětlení]":"Composition & light: [angle, shot, lighting]");
  b.push("Parameters: --ar 16:9 --q 2");
  {const apx=approachLine();if(apx)b.push((cs?"Přístup: ":"Approach: ")+apx);}
  if(S.avoid.trim())b.push((cs?"Negative prompt: ":"Negative prompt: ")+S.avoid.trim());
  return b.join("\n");}
function buildSlides(){const d=OL(),H=d.H,cs=S.outLang==="cs",b=[];
  b.push(`# ${H.TOPIC}\n${val(S.task,d.defaultTask)}`);
  if(S.goal.trim())b.push(`# ${H.GOAL}\n${S.goal.trim()}`);
  if(S.aud.trim())b.push(`# ${H.AUDIENCE}\n${S.aud.trim()}`);
  b.push(`# ${H.SLIDES}\n${{0:"6–8",1:"10–12",2:"15+"}[S.length]}`);
  b.push(`# ${H.TONE}\n${d.tones[S.tone]}`);
  b.push(`# ${H.VISUAL}\n${cs?"[barvy / brand / nálada]":"[colors / brand / mood]"}`);
  b.push(`# ${H.KEY}\n${S.ctx.trim()||(cs?"[hlavní body, jeden na slide]":"[key points, one per slide]")}`);
  if(S.avoid.trim())b.push(`# ${H.AVOID}\n${S.avoid.trim()}`);
  {const gl=[];const apx=approachLine();if(apx)gl.push("- "+apx);if(S.tech.nohall)gl.push("- "+d.techS.nohall);if(gl.length)b.push(`# ${H.GUIDE}\n${gl.join("\n")}`);}
  b.push(`# ${H.LANG}\n${d.respond}`);return b.join("\n\n");}
function buildDuvo(){const d=OL(),H=d.H,cs=S.outLang==="cs",b=[];
  b.push(`# ${H.GOAL}\n${val(S.goal,cs?"[jaký výsledek má agent doručit]":"[the outcome the agent should deliver]")}`);
  b.push(`# ${H.TASK}\n${val(S.task,cs?"[jaký proces automatizovat]":"[which process to automate]")}`);
  b.push(`# ${H.TRIGGER}\n${cs?"[kdy spustit — událost, čas, e-mail/soubor]":"[when it runs — event, schedule, email/file]"}`);
  b.push(`# ${H.INPUTS}\n${S.ctx.trim()||(cs?"[systémy: portály, e-maily, tabulky, ERP]":"[systems: portals, emails, sheets, ERP]")}`);
  b.push(`# ${H.STEPS}\n1. [${cs?"krok":"step"}]\n2. [${cs?"krok":"step"}]\n3. [${cs?"krok":"step"}]`);
  const r=[];if(S.tech.ground||S.tech.nohall)r.push(cs?"rozhoduj jen podle dat z propojených systémů, nic nevymýšlej":"decide only from connected-system data, invent nothing");
  r.push(cs?"[pravidlo: pokud X, pak Y]":"[rule: if X then Y]");
  b.push(`# ${H.RULES}\n- ${r.join("\n- ")}`);
  b.push(`# ${H.GUARD}\n- ${cs?"eskaluj na člověka při: [nejednoznačnost / částka nad limit / chybí data]":"escalate to a human on: [ambiguity / amount over limit / missing data]"}`);
  b.push(`# ${H.OUTPUT}\n${cs?"[kam zapsat výsledek]":"[where to write the result]"}`);
  if(S.avoid.trim())b.push(`# ${H.AVOID}\n${S.avoid.trim()}`);return b.join("\n\n");}
function buildFromFields(){switch(S.target){case"claude":return buildStandard("xml");case"perplexity":return buildPerplexity();
  case"image":return buildImage();case"slides":return buildSlides();case"duvo":return buildDuvo();default:return buildStandard("md");}}

/* base text depending on mode */
function baseText(){return S.mode==="raw"?S.rawText:buildFromFields();}

/* ====== VARIABLES ====== */
function detectVars(text){const re=/\[INSERT[^\]]*\]|\{\{[^}]+\}\}/g;const set=[];let m;
  while((m=re.exec(text))!==null){if(!set.includes(m[0]))set.push(m[0]);}return set;}
function fillVars(text){let out=text;Object.keys(S.vars).forEach(k=>{const v=S.vars[k];if(v&&v.trim()){out=out.split(k).join(v.trim());}});return out;}
function effectivePrompt(){return fillVars(baseText());}

function renderVars(){
  const text=baseText();const found=detectVars(text);
  const panel=$("varsPanel"),list=$("varsList");
  if(!found.length){panel.classList.add("hide");list.innerHTML="";return;}
  panel.classList.remove("hide");$("varsHead").textContent=L().varsHead;addIcon("varsHead","vars");
  list.innerHTML="";
  found.forEach(k=>{
    const row=document.createElement("div");row.className="varrow";
    const lab=document.createElement("div");lab.className="varkey";lab.textContent=k;
    const inp=document.createElement("input");inp.type="text";inp.value=S.vars[k]||"";
    inp.placeholder=L().uiLang==="en"?"value…":"hodnota…";
    inp.oninput=()=>{S.vars[k]=inp.value;render(false);};
    row.appendChild(lab);row.appendChild(inp);list.appendChild(row);
  });
}

/* ====== RENDER ====== */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function highlight(t){return esc(t).replace(/^# (.+)$/gm,'<span class="tag"># $1</span>')
  .replace(/^&lt;([a-z_]+)&gt;$/gm,'<span class="tag">&lt;$1&gt;</span>')
  .replace(/^&lt;\/([a-z_]+)&gt;$/gm,'<span class="tag">&lt;/$1&gt;</span>')
  .replace(/(\[INSERT[^\]]*\]|\{\{[^}]+\}\})/g,'<span class="vr">$1</span>');}
function lenState(eff){
  const budget=BUDGET[S.target]||4000;const pct=eff.length/budget;
  let st="ok";if(pct>1)st="bad";else if(pct>0.6)st="warn";
  return {pct:Math.min(pct,1.3),st,budget};
}
function render(updVars=true){
  const d=L();
  $("modeTag").textContent = S.mode==="raw"?d.modeRaw:d.modeBuild;
  $("builderBtn").classList.toggle("hide",S.mode!=="raw");
  // output box vs raw editor
  const eff=effectivePrompt();
  if(S.mode==="raw"){
    $("outBox").classList.add("hide");$("rawEdit").classList.remove("hide");
    if($("rawEdit").value!==S.rawText)$("rawEdit").value=S.rawText;
  }else{
    $("rawEdit").classList.add("hide");$("outBox").classList.remove("hide");
    const has=S.task.trim()||S.goal.trim()||S.roleIdx>0||S.roleCustom;
    $("outBox").innerHTML=has?highlight(eff):`<span class="empty">${d.emptyMsg}</span>`;
  }
  $("hint").textContent=d.hints[S.target]||"";
  // length
  const ls=lenState(eff);
  $("lenLabel").textContent=d.lenLabel;
  $("lenCount").textContent=eff.length+" / "+ls.budget;
  const fill=$("lenFill");fill.style.width=Math.round(ls.pct*100)+"%";
  fill.style.background=ls.st==="bad"?"var(--bad)":ls.st==="warn"?"var(--warn)":"var(--ok)";
  const adv=$("lenAdvice");adv.textContent=d.lenAdv[ls.st];adv.className="lenadvice"+(ls.st==="warn"?" warn":ls.st==="bad"?" bad":"");
  // quality
  const checks=[S.task.trim(),S.goal.trim(),S.ctx.trim(),S.avoid.trim(),(S.aud.trim()||S.roleIdx>0||S.roleCustom.trim())];
  const score=checks.filter(Boolean).length;
  $("qDots").innerHTML=checks.map((c,i)=>`<div class="qdot${c?" on":""}"></div>`).join("");
  $("qTxt").textContent=d.qTxt(score);
  if(updVars)renderVars();
}

function snapshot(){return JSON.parse(JSON.stringify({target:S.target,outLang:S.outLang,mode:S.mode,rawText:S.rawText,

  <div class="faqa">Měřič je <b>vodítko</b>. Vestavěné/beta nástroje (Rohlik Ads) mají krátký limit — moc dlouhé prompty padají na chybu. Když svítí oranžová/červená, použij follow-up <b>„Zkrať“</b> nebo <b>„Rozděl na kroky“</b>.</div>
  <div class="faqq">Jazyk</div>
  <div class="faqa">Rozhraní a Jazyk výstupu jsou <b>oddělené</b> — můžeš psát vstupy česky a chtít finální prompt anglicky (nebo naopak).</div>
  <div class="faqq">Aktualizace & feedback</div>
  <div class="faqa">Nástroj žije na jedné adrese; když přijde nová verze, <b>aktualizuje se sama</b> (kdyby svítila stará, dej <b>Ctrl+F5</b>). Připomínky a nápady posílej do určeného Teams vlákna.</div>`,
 en:`<button class="modalclose" id="faqClose">Close ✕</button>
  <h2>What Prompt Engineer is</h2>
  <div class="faqq">What's new (changelog)</div>
  <div class="faqa"><b>v1.1</b> — added <b>Approach / creativity</b> (4 modes) and a <b>Zero hallucination</b> toggle; FAQ with changelog.<br><b>v1.0</b> — Rohlik Ads prompt library, variables, length meter, follow-ups, CZ/EN output, ⓘ help, saved prompts.</div>
  <p class="lead">A tool that helps you write a <b>high-quality, structured prompt</b>. You fill in fields, it assembles the prompt, you copy it and paste it into the real AI tool (Claude, ChatGPT, Perplexity, Rohlik Ads Assistant…).</p>
  <div class="faqq">What it is NOT</div>
  <div class="faqa">It is not an AI. <b>It doesn't think, answer, read links or attached files, and sends nothing anywhere.</b> It only assembles text. The answer comes from the tool you paste the prompt into.</div>
  <div class="faqq">How to use it</div>
  <div class="faqa">1) Pick the <b>target tool</b> at the top (changes format and length limit). 2) Fill the fields on the left — <b>Task</b> is required, <b>Goal/Context</b> help a lot. 3) The prompt assembles <b>live</b> on the right. 4) <b>Copy</b> → paste into the tool. Every field has an <b>ⓘ</b> with an explanation.</div>
  <div class="faqa"><b>Library</b> = ready templates (incl. Rohlik Ads). <b>Variables</b> = fill the [INSERT…] slots (dates, companies, campaigns) — substituted on copy. <b>Follow-up</b> = ready lines to paste AFTER the tool replies (double-check, shorten, split into steps…).</div>
  <div class="faqq">Approach / creativity & hallucinations</div>
  <div class="faqa"><b>Approach</b> has 4 modes: Factual (data, numbers — Rohlik Ads), Balanced, Creative, Brainstorming (ideas, content). For data tasks pick Factual. The <b>Zero hallucination</b> toggle adds a strong instruction: only verified facts, no invented data/sources, flag anything uncertain. <b>Note:</b> even this won't guarantee zero hallucinations — it strongly reduces them, but always verify critical numbers.</div>
  <div class="faqq">How NOT to use it</div>
  <div class="faqa">Don't expect it to read an attached document or link — only the target tool can. It doesn't generate an answer, only a prompt. It's not a chat.</div>
  <div class="faqq">Saving — important</div>
  <div class="faqa">Saved prompts and history live <b>only in your browser on this device</b>. They are <b>not shared</b> — everyone has their own. We share the <b>tool</b>, not the content. To move or back up prompts use <b>Export</b> (and <b>Import</b> on another machine).</div>
  <div class="faqq">Prompt length</div>
  <div class="faqa">The meter is a <b>guide</b>. Embedded/beta tools (Rohlik Ads) have a short limit — overly long prompts fail. When it's amber/red, use the <b>“Shorten”</b> or <b>“Split into steps”</b> follow-up.</div>
  <div class="faqq">Language</div>
  <div class="faqa">Interface and Output language are <b>separate</b> — you can type inputs in Czech and want the final prompt in English (or vice versa).</div>
  <div class="faqq">Updates & feedback</div>
  <div class="faqa">The tool lives at one address; when a new version ships it <b>updates automatically</b> (if you see an old one, press <b>Ctrl+F5</b>). Send ideas and issues to the designated Teams thread.</div>`
